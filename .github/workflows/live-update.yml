name: Live Update
on:
  push:
    branches: [capacitor-samoo]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare www from original app
        run: |
          rm -rf www && mkdir www
          cp index.html profile.png www/
          cp -r css js www/
          test -f www/js/app.js && test -f www/js/firebase-config.js
      - name: Create bundle
        run: |
          ID=$(git rev-parse --short=12 HEAD)
          mkdir -p site/bundles
          (cd www && zip -qr ../site/bundles/$ID.zip .)
          unzip -l site/bundles/$ID.zip
          echo "{\"bundleId\":\"$ID\",\"url\":\"https://alisamoo1998-oss.github.io/new-app-samoo/bundles/$ID.zip\"}" > site/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4